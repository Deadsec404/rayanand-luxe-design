<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 80 260 275" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ultra High-Luminance Metallic Gold Gradients for maximum clarity -->
    <linearGradient id="embGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="25%" stop-color="#E5C788" />
      <stop offset="60%" stop-color="#C9A15B" />
      <stop offset="85%" stop-color="#A57A33" />
      <stop offset="100%" stop-color="#FCEFD8" />
    </linearGradient>

    <linearGradient id="embGoldHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFE7B3" />
      <stop offset="70%" stop-color="#C9A15B" />
      <stop offset="100%" stop-color="#8C6324" />
    </linearGradient>

    <filter id="embGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C9A15B" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="crestEmblem" filter="url(#embGlow)">
    <!-- Thin Circular Framing Arc (Top-Right Sweep) -->
    <path
      d="M 215 95 C 285 95 352 132 358 202 C 364 265 324 322 258 343 C 212 357 168 348 142 326"
      stroke="url(#embGoldGrad)"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Leaf / Laurel Branch (Left Side) -->
    <!-- Main stem -->
    <path
      d="M 166 312 C 138 278 128 220 172 116"
      stroke="url(#embGoldGrad)"
      stroke-width="2.5"
      fill="none"
      stroke-linecap="round"
    />

    <!-- Individual Laurel Leaves with rich metallic gold fill -->
    <!-- Leaf 1 (Bottom Left) -->
    <path d="M 148 290 C 128 296 118 284 125 270 C 136 268 146 279 148 290 Z" fill="url(#embGoldHighlight)" />
    <!-- Leaf 2 (Bottom Left Upper) -->
    <path d="M 142 264 C 120 268 114 254 123 240 C 134 243 141 254 142 264 Z" fill="url(#embGoldHighlight)" />
    <!-- Leaf 3 (Mid Left) -->
    <path d="M 140 234 C 116 233 113 216 125 205 C 137 210 141 222 140 234 Z" fill="url(#embGoldHighlight)" />
    <!-- Leaf 4 (Mid Upper Left) -->
    <path d="M 146 204 C 125 196 125 179 138 171 C 148 180 149 193 146 204 Z" fill="url(#embGoldHighlight)" />
    <!-- Leaf 5 (Upper Left) -->
    <path d="M 153 171 C 137 158 142 142 156 137 C 162 150 160 163 153 171 Z" fill="url(#embGoldHighlight)" />
    <!-- Leaf 6 (Top Left Sprout) -->
    <path d="M 165 138 C 156 122 166 109 178 109 C 180 122 173 133 165 138 Z" fill="url(#embGoldHighlight)" />
    <!-- Leaf 7 (Top Tip) -->
    <path d="M 174 116 C 177 99 191 95 197 103 C 193 115 183 121 174 116 Z" fill="url(#embGoldHighlight)" />

    <!-- Central Monogram 'R' -->
    <path
      d="M 176 114 L 246 114 C 298 114 328 138 328 180 C 328 215 302 237 266 243 L 332 338 C 335 342 340 344 348 344 L 354 344 C 345 348 330 351 317 351 C 304 351 294 344 286 333 L 230 248 L 208 248 L 208 337 C 208 345 214 348 226 348 L 230 348 L 230 353 L 168 353 L 168 348 L 176 348 C 188 348 192 345 192 337 L 192 130 C 192 122 188 119 176 119 Z"
      fill="url(#embGoldGrad)"
    />

    <!-- Architectural House Gable Overlay inside R's Lower Leg -->
    <path
      d="M 248 182 L 183 342 L 192 346 L 248 198 L 308 344 L 317 340 Z"
      fill="url(#embGoldHighlight)"
    />

    <!-- 4-Pane Architectural Window inside House Gable -->
    <g transform="translate(234, 276)">
      <!-- Window Pane Top-Left -->
      <rect x="0" y="0" width="11" height="11" rx="1.5" fill="url(#embGoldHighlight)" stroke="#C9A15B" stroke-width="0.5" />
      <!-- Window Pane Top-Right -->
      <rect x="15" y="0" width="11" height="11" rx="1.5" fill="url(#embGoldHighlight)" stroke="#C9A15B" stroke-width="0.5" />
      <!-- Window Pane Bottom-Left -->
      <rect x="0" y="15" width="11" height="11" rx="1.5" fill="url(#embGoldHighlight)" stroke="#C9A15B" stroke-width="0.5" />
      <!-- Window Pane Bottom-Right -->
      <rect x="15" y="15" width="11" height="11" rx="1.5" fill="url(#embGoldHighlight)" stroke="#C9A15B" stroke-width="0.5" />
    </g>

    <!-- Inner counter space of 'R' loop -->
    <path
      d="M 210 134 L 246 134 C 278 134 300 148 300 180 C 300 210 278 226 246 226 L 210 226 Z"
      fill="#090909"
    />
    <path
      d="M 210 137 L 243 137 C 270 137 290 149 290 180 C 290 207 270 222 243 222 L 210 222 Z"
      fill="url(#embGoldHighlight)"
      opacity="0.18"
    />
  </g>
</svg>
